<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр по математике</title>
<style>
  :root {
    --bg: #14142b;
    --bg2: #1c1c3f;
    --card: #232349;
    --ink: #f0f0ff;
    --muted: #9a9ac8;
    --line: #34346a;
    --violet: #7c6cf0;
    --violet-2: #9a8bff;
    --mint: #34d399;
    --green-2: #4ade80;
    --coral: #ff6b6b;
    --gold: #ffcb5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-rounded, "Segoe UI Rounded", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #2a2a63 0%, transparent 55%),
      radial-gradient(1000px 500px at 110% 110%, #3a2a63 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border-radius: 26px;
    padding: 30px 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    border: 1px solid var(--line);
    position: relative;
    z-index: 1;
  }
  h1 { font-size: 23px; text-align: center; letter-spacing: .3px; text-wrap: balance; }
  .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin: 8px 0 22px; }
  .label {
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); text-align: center; margin: 4px 0 12px;
  }
  /* Выбор действия */
  .ops { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-bottom: 16px; }
  .op-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    color: var(--ink); border-radius: 14px; font: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform .12s, background .15s, border-color .15s;
  }
  .op-btn:hover { border-color: var(--violet); transform: translateY(-2px); }
  .op-btn.active { background: linear-gradient(180deg, var(--violet-2), var(--violet)); border-color: transparent; color: #fff; box-shadow: 0 8px 20px rgba(124,108,240,.45); }
  .op-emoji { font-size: 18px; }

  .picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; margin-bottom: 10px; }
  .pick-btn {
    padding: 14px 0; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    color: var(--ink); border-radius: 14px; font: inherit; font-size: 18px; font-weight: 700;
    cursor: pointer; transition: transform .12s, background .15s, border-color .15s;
    font-variant-numeric: tabular-nums;
  }
  .pick-btn:hover { border-color: var(--violet); transform: translateY(-2px); }
  .pick-btn.active {
    background: linear-gradient(180deg, var(--violet-2), var(--violet));
    border-color: transparent; color: #fff; box-shadow: 0 8px 20px rgba(124,108,240,.45);
  }
  .pick-btn.all { grid-column: span 5; letter-spacing: .3px; margin-bottom: 4px; }
  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 16px; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: rgba(0,0,0,.2); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .t-label { font-weight: 700; font-size: 14px; }
  .t-sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .switch {
    width: 52px; height: 30px; border-radius: 20px; border: none; background: #3a3a70;
    position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
    border-radius: 50%; background: #fff; transition: left .2s;
  }
  .switch.on { background: linear-gradient(180deg, var(--coral), #e04b4b); }
  .switch.on::after { left: 25px; }

  .record-line { text-align: center; color: var(--gold); font-weight: 700; font-size: 15px; margin: 6px 0 16px; }
  .start-btn {
    width: 100%; padding: 16px; margin-top: 4px;
    background: linear-gradient(180deg, var(--violet-2), var(--violet)); color: #fff; border: none;
    border-radius: 16px; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer;
    box-shadow: 0 12px 26px rgba(124,108,240,.4); transition: transform .12s, filter .15s;
  }
  .start-btn:hover { filter: brightness(1.07); transform: translateY(-2px); }
  .start-btn:active { transform: translateY(0); }

  .stats { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .timer { font-weight: 800; font-size: 16px; color: var(--mint); font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--coral); }
  .timer.hidden { display: none; }
  .progress-bar { height: 10px; background: rgba(0,0,0,.3); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--mint)); transition: width .35s ease; }
  .question { text-align: center; font-size: 48px; font-weight: 800; margin: 6px 0 22px; font-variant-numeric: tabular-nums; }
  .answer-input {
    width: 100%; padding: 18px; font: inherit; font-size: 30px; font-weight: 700; text-align: center;
    border-radius: 16px; border: 2px solid var(--line); background: rgba(0,0,0,.25);
    color: var(--ink); outline: none; transition: border-color .15s; -moz-appearance: textfield;
  }
  .answer-input::-webkit-outer-spin-button, .answer-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .answer-input:focus { border-color: var(--violet); }
  .answer-input.shake { animation: shake .4s; border-color: var(--coral); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }
  .feedback { text-align: center; min-height: 26px; margin: 16px 0; font-size: 16px; font-weight: 700; }
  .feedback.good { color: var(--mint); }
  .feedback.bad { color: var(--coral); }
  .row-btns { display: flex; gap: 12px; }
  .btn { flex: 1; padding: 15px; border-radius: 16px; border: none; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform .12s, filter .15s; }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: linear-gradient(180deg, var(--violet-2), var(--violet)); color: #fff; box-shadow: 0 10px 22px rgba(124,108,240,.4); }
  .btn-next { background: linear-gradient(180deg, var(--green-2), var(--mint)); color: #06281c; box-shadow: 0 10px 24px rgba(52,211,153,.45); }
  .btn-ghost { background: rgba(255,255,255,.04); color: var(--ink); border: 1px solid var(--line); }
  .hidden { display: none; }
  .result { text-align: center; }
  .result .emoji { font-size: 60px; margin-bottom: 6px; }
  .result .score { font-size: 50px; font-weight: 800; margin: 6px 0; font-variant-numeric: tabular-nums; }
  .result .detail { color: var(--muted); margin-bottom: 6px; }
  .result .record-new { color: var(--gold); font-weight: 800; margin-bottom: 20px; min-height: 22px; }

  .flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 999; }
  .flash-wrong { animation: flashWrong 1s ease-out; }
  .flash-good { animation: flashGood .5s ease-out; }
  @keyframes flashWrong {
    0%   { background: #ff2d2d; opacity: .92; }
    45%  { background: #ff2d2d; opacity: .70; }
    55%  { background: #ffffff; opacity: .95; }
    100% { background: #ffffff; opacity: 0; }
  }
  @keyframes flashGood { 0% { background: #34d399; opacity: .5; } 100% { background: #34d399; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .answer-input.shake, .flash-wrong, .flash-good { animation: none; }
    * { transition: none !important; }
  }

  /* Вторичная кнопка (Посмотреть таблицы) */
  .secondary-btn {
    width: 100%; padding: 14px; margin-top: 10px; background: rgba(255,255,255,.04);
    color: var(--ink); border: 1px solid var(--line); border-radius: 16px; font: inherit;
    font-size: 15px; font-weight: 700; cursor: pointer; transition: border-color .15s, transform .12s;
  }
  .secondary-btn:hover { border-color: var(--violet); transform: translateY(-2px); }

  /* Раздел «Таблицы» */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 14px; }
  .tab {
    display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 6px;
    border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--ink);
    border-radius: 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: transform .12s, background .15s, border-color .15s;
  }
  .tab:hover { border-color: var(--violet); transform: translateY(-2px); }
  .tab.active { background: linear-gradient(180deg, var(--violet-2), var(--violet)); border-color: transparent; color: #fff; }
  .picker.mini { margin-bottom: 6px; }
  .pick-btn.mini { padding: 10px 0; font-size: 16px; }
  .tlist { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 18px; }
  .trow {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .trow .res { color: var(--mint); }
  .pwrap { overflow-x: auto; margin: 14px 0 18px; }
  .pgrid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; min-width: 380px; }
  .pcell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,.03);
    font-variant-numeric: tabular-nums;
  }
  .pcell.head { background: var(--violet); color: #fff; cursor: pointer; }
  .pcell.sel { background: var(--gold); color: #3a2c00; }
  .pcell.path { background: rgba(124,108,240,.32); }
  .pcell.answer { background: var(--mint); color: #06281c; box-shadow: 0 0 0 2px var(--mint); }
  .pcell.corner { background: transparent; color: var(--muted); }
  .pif-answer { text-align: center; font-size: 22px; font-weight: 800; margin-bottom: 14px; color: var(--mint); min-height: 28px; font-variant-numeric: tabular-nums; }
  .pif-answer.hint { color: var(--muted); font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div id="flash" class="flash"></div>
<div class="app">

  <!-- ЭКРАН НАСТРОЙКИ -->
  <div id="setup">
    <h1>🧮 Тренажёр по математике</h1>
    <p class="subtitle">Выбери действие и число</p>
    <div class="label">Действие</div>
    <div class="ops" id="ops"></div>
    <div class="label">Число (можно несколько)</div>
    <div class="picker" id="picker"></div>
    <div class="label">Сколько вопросов</div>
    <div class="counts" id="counts"></div>
    <div class="toggle-row">
      <span class="t-label">🔥 Опасный режим
        <span class="t-sub">Таймер на каждый вопрос + бонус за скорость</span>
      </span>
      <button class="switch" id="dangerToggle" role="switch" aria-checked="false" aria-label="Опасный режим"></button>
    </div>
    <div class="record-line" id="recordLine">🏆 Рекорд: 0 очков</div>
    <button class="start-btn" id="startBtn">Начать тренировку →</button>
    <button class="secondary-btn" id="openTables">📖 Посмотреть таблицы</button>
  </div>

  <!-- ЭКРАН ТРЕНИРОВКИ -->
  <div id="trainer" class="hidden">
    <div class="stats">
      <span>Вопрос <b id="qNum">1</b>/<b id="qTotal">10</b></span>
      <span>Очки: <b id="scoreNow">0</b></span>
      <span class="timer" id="timer">⏱ 10</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question" id="question">2 × 3</div>
    <input type="number" class="answer-input" id="answerInput" placeholder="?" inputmode="numeric" autocomplete="off">
    <div class="feedback" id="feedback"></div>
    <div class="row-btns">
      <button class="btn btn-ghost" id="quitBtn">Выйти</button>
      <button class="btn btn-primary" id="checkBtn">Проверить</button>
      <button class="btn btn-next hidden" id="nextBtn">Далее →</button>
    </div>
  </div>

  <!-- ЭКРАН РЕЗУЛЬТАТА -->
  <div id="result" class="hidden">
    <div class="result">
      <div class="emoji" id="resultEmoji">🎉</div>
      <div class="score" id="resultScore">0 очков</div>
      <p class="detail" id="resultDetail">из 200 возможных</p>
      <p class="record-new" id="recordNew"></p>
      <div class="row-btns">
        <button class="btn btn-ghost" id="menuBtn">В меню</button>
        <button class="btn btn-primary" id="againBtn">Ещё раз</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН ТАБЛИЦ (просмотр) -->
  <div id="tables" class="hidden">
    <h1>📖 Таблицы</h1>
    <p class="subtitle">Просто посмотреть — как шпаргалка</p>
    <div class="tabs" id="tableTabs"></div>
    <div class="picker mini" id="tablePick"></div>
    <div id="tableBody"></div>
    <button class="start-btn" id="tablesBack">← В меню</button>
  </div>

</div>

<script>
  // ====== НАСТРОЙКИ ======
  const MAX_FACTOR = 10;   // второе число в примере (1..10)
  const PER_Q = 10;        // секунд на вопрос в опасном режиме

  // Описание всех действий. Для каждого — как построить пример.
  const OPS = {
    mul: { emoji: '✖️', name: 'Умножение',  make: (n, k) => ({ text: `${n} × ${k}`,       answer: n * k }) },
    div: { emoji: '➗', name: 'Деление',    make: (n, k) => ({ text: `${n * k} ÷ ${n}`,   answer: k }) },
    add: { emoji: '➕', name: 'Сложение',   make: (n, k) => ({ text: `${n} + ${k}`,       answer: n + k }) },
    sub: { emoji: '➖', name: 'Вычитание',  make: (n, k) => ({ text: `${n + k} − ${n}`,   answer: k }) },
  };

  // ====== СОСТОЯНИЕ ======
  let op = 'mul';         // выбранное действие
  let selected = [];
  let total = 10;
  let danger = false;
  let questions = [];
  let current = 0;
  let score = 0;
  let timeLeft = PER_Q;
  let timerId = null;

  // ---------- Кнопки действий ----------
  const opsEl = document.getElementById('ops');
  Object.keys(OPS).forEach((key, idx) => {
    const b = document.createElement('button');
    b.className = 'op-btn' + (idx === 0 ? ' active' : '');
    b.dataset.op = key;
    b.innerHTML = `<span class="op-emoji">${OPS[key].emoji}</span> ${OPS[key].name}`;
    opsEl.appendChild(b);
  });
  opsEl.addEventListener('click', (e) => {
    const b = e.target.closest('.op-btn');
    if (!b) return;
    document.querySelectorAll('.op-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    op = b.dataset.op;
    showRecord(); // у каждого действия свой рекорд
  });

  // ---------- Кнопки чисел ----------
  const picker = document.getElementById('picker');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('button');
    b.className = 'pick-btn pick-num';
    b.textContent = i;
    b.dataset.val = i;
    picker.appendChild(b);
  }
  const allBtn = document.createElement('button');
  allBtn.className = 'pick-btn all';
  allBtn.textContent = 'Все подряд 🎲';
  picker.appendChild(allBtn);
  picker.addEventListener('click', (e) => {
    const numBtn = e.target.closest('.pick-num');
    if (numBtn) { numBtn.classList.toggle('active'); return; }
    if (e.target.closest('.all')) document.querySelectorAll('.pick-num').forEach(b => b.classList.add('active'));
  });

  // ---------- Количество вопросов ----------
  const counts = document.getElementById('counts');
  [5, 10, 20].forEach((n, idx) => {
    const b = document.createElement('button');
    b.className = 'pick-btn' + (idx === 1 ? ' active' : '');
    b.textContent = n;
    b.dataset.count = n;
    counts.appendChild(b);
  });
  counts.addEventListener('click', (e) => {
    const b = e.target.closest('.pick-btn');
    if (!b) return;
    document.querySelectorAll('#counts .pick-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    total = parseInt(b.dataset.count, 10);
  });

  // ---------- Опасный режим ----------
  const dangerToggle = document.getElementById('dangerToggle');
  dangerToggle.addEventListener('click', () => {
    danger = !danger;
    dangerToggle.classList.toggle('on', danger);
    dangerToggle.setAttribute('aria-checked', danger);
  });

  // ---------- Рекорд (свой для каждого действия) ----------
  function recordKey() { return 'trainer-record-' + op; }
  function getRecord() { return parseInt(localStorage.getItem(recordKey()) || '0', 10); }
  function showRecord() {
    document.getElementById('recordLine').textContent =
      `🏆 Рекорд (${OPS[op].name.toLowerCase()}): ${getRecord()} очков`;
  }
  showRecord();

  // ---------- Экраны ----------
  const setupEl = document.getElementById('setup');
  const trainerEl = document.getElementById('trainer');
  const resultEl = document.getElementById('result');
  const tablesEl = document.getElementById('tables');
  function show(el) { [setupEl, trainerEl, resultEl, tablesEl].forEach(x => x.classList.add('hidden')); el.classList.remove('hidden'); }
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function buildQuestions() {
    questions = [];
    for (let i = 0; i < total; i++) {
      const n = selected[rand(0, selected.length - 1)]; // случайное из выбранных чисел
      const k = rand(1, MAX_FACTOR);
      questions.push(OPS[op].make(n, k));               // строим пример по действию
    }
  }

  // ---------- Элементы тренировки ----------
  const qNum = document.getElementById('qNum');
  const qTotal = document.getElementById('qTotal');
  const scoreNow = document.getElementById('scoreNow');
  const timerEl = document.getElementById('timer');
  const questionEl = document.getElementById('question');
  const answerInput = document.getElementById('answerInput');
  const feedback = document.getElementById('feedback');
  const progressFill = document.getElementById('progressFill');
  const checkBtn = document.getElementById('checkBtn');
  const nextBtn = document.getElementById('nextBtn');
  const flashEl = document.getElementById('flash');

  function startTraining() {
    selected = [...document.querySelectorAll('.pick-num.active')].map(b => parseInt(b.dataset.val, 10));
    if (selected.length === 0) { alert('Выбери хотя бы одно число!'); return; }
    buildQuestions();
    current = 0; score = 0;
    qTotal.textContent = total;
    scoreNow.textContent = 0;
    show(trainerEl);
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[current];
    qNum.textContent = current + 1;
    questionEl.textContent = q.text;
    answerInput.value = '';
    answerInput.disabled = false;
    feedback.textContent = '';
    feedback.className = 'feedback';
    progressFill.style.width = (current / total * 100) + '%';
    checkBtn.classList.remove('hidden');
    nextBtn.classList.add('hidden');
    timerEl.classList.toggle('hidden', !danger);
    answerInput.focus();
    if (danger) startTimer();
  }

  // ---------- Таймер ----------
  function startTimer() {
    timeLeft = PER_Q;
    updateTimerUI();
    timerId = setInterval(() => {
      timeLeft--;
      updateTimerUI();
      if (timeLeft <= 0) { stopTimer(); timeUp(); }
    }, 1000);
  }
  function stopTimer() { clearInterval(timerId); timerId = null; }
  function updateTimerUI() {
    timerEl.textContent = '⏱ ' + timeLeft;
    timerEl.classList.toggle('low', timeLeft <= 3);
  }

  // ---------- Вспышка ----------
  function flash(kind) {
    flashEl.className = 'flash';
    void flashEl.offsetWidth;
    flashEl.classList.add(kind === 'wrong' ? 'flash-wrong' : 'flash-good');
  }

  function timeUp() {
    const q = questions[current];
    flash('wrong');
    feedback.textContent = `⏱ Время вышло! ${q.text} = ${q.answer}`;
    feedback.className = 'feedback bad';
    answerInput.classList.add('shake');
    setTimeout(() => answerInput.classList.remove('shake'), 400);
    finishQuestion();
  }

  function checkAnswer() {
    const q = questions[current];
    const val = answerInput.value.trim();
    if (val === '') { answerInput.focus(); return; }
    stopTimer();
    const user = parseInt(val, 10);

    if (user === q.answer) {
      const gained = danger ? 10 + timeLeft : 10;
      score += gained;
      scoreNow.textContent = score;
      flash('good');
      feedback.textContent = `✅ Верно! +${gained}`;
      feedback.className = 'feedback good';
    } else {
      flash('wrong');
      feedback.textContent = `❌ Неверно. Правильно: ${q.text} = ${q.answer}`;
      feedback.className = 'feedback bad';
      answerInput.classList.add('shake');
      setTimeout(() => answerInput.classList.remove('shake'), 400);
    }
    finishQuestion();
  }

  function finishQuestion() {
    answerInput.disabled = true;
    progressFill.style.width = ((current + 1) / total * 100) + '%';
    checkBtn.classList.add('hidden');
    nextBtn.classList.remove('hidden');
    nextBtn.focus();
  }

  function goNext() {
    current++;
    current < total ? renderQuestion() : showResult();
  }

  // ---------- Результат ----------
  function showResult() {
    show(resultEl);
    document.getElementById('resultScore').textContent = `${score} очков`;
    const perCorrect = danger ? (10 + PER_Q) : 10;
    const maxScore = total * perCorrect;
    document.getElementById('resultDetail').textContent = `из ${maxScore} возможных`;

    const record = getRecord();
    const recordNew = document.getElementById('recordNew');
    if (score > record) {
      localStorage.setItem(recordKey(), score);
      recordNew.textContent = '🏆 Новый рекорд!';
    } else {
      recordNew.textContent = `Рекорд: ${record} очков`;
    }

    const pct = maxScore ? score / maxScore : 0;
    let emoji;
    if (pct >= 0.95)     emoji = '🏆';
    else if (pct >= 0.7) emoji = '🎉';
    else if (pct >= 0.4) emoji = '👍';
    else                 emoji = '💪';
    document.getElementById('resultEmoji').textContent = emoji;
    showRecord();
  }

  // ---------- Раздел «Таблицы» (просмотр) ----------
  const TABS = { mul: '✖️ Умножения', div: '➗ Деления', pif: '⬜ Пифагора' };
  let tableMode = 'mul';  // какая вкладка открыта
  let tableNum = 2;       // какое число смотрим (для умножения/деления)
  let pifPicks = [];      // выбранные числа по краям Пифагора (до 2 штук)

  const tableTabs = document.getElementById('tableTabs');
  Object.keys(TABS).forEach(mode => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.mode = mode;
    b.textContent = TABS[mode];
    tableTabs.appendChild(b);
  });
  tableTabs.addEventListener('click', (e) => {
    const b = e.target.closest('.tab');
    if (!b) return;
    tableMode = b.dataset.mode;
    pifPicks = [];   // при смене вкладки сбрасываем выбор
    renderTable();
  });

  const tablePick = document.getElementById('tablePick');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('button');
    b.className = 'pick-btn mini';
    b.textContent = i;
    b.dataset.val = i;
    tablePick.appendChild(b);
  }
  tablePick.addEventListener('click', (e) => {
    const b = e.target.closest('.pick-btn');
    if (!b) return;
    tableNum = parseInt(b.dataset.val, 10);
    renderTable();
  });

  const tableBody = document.getElementById('tableBody');

  // Клик по числу на краю Пифагора: выбираем до двух чисел
  tableBody.addEventListener('click', (e) => {
    const head = e.target.closest('.pcell.head');
    if (!head || tableMode !== 'pif') return;
    const pick = { kind: head.dataset.kind, n: parseInt(head.dataset.n, 10) };
    if (pifPicks.length >= 2) pifPicks = [];   // уже выбрано два — начинаем заново
    const idx = pifPicks.findIndex(p => p.kind === pick.kind && p.n === pick.n);
    if (idx >= 0) pifPicks.splice(idx, 1);     // повторный клик — снять выбор
    else pifPicks.push(pick);
    renderTable();
  });

  function pifGrid() {
    const nums = pifPicks.map(p => p.n);
    const a = nums[0], b = nums[1];
    const ready = (a != null && b != null);

    // строка и столбец, которые ведут к ответу
    let hi = null, hj = null;
    if (ready) {
      const left = pifPicks.find(p => p.kind === 'left');
      const top = pifPicks.find(p => p.kind === 'top');
      if (left && top) { hi = left.n; hj = top.n; } else { hi = a; hj = b; }
    }
    const isSel = (kind, n) => pifPicks.some(p => p.kind === kind && p.n === n);

    const banner = ready
      ? `<div class="pif-answer">${a} × ${b} = ${a * b}</div>`
      : `<div class="pif-answer hint">Нажми на два числа по краям</div>`;

    let cells = '<div class="pcell corner">×</div>';
    for (let j = 1; j <= 10; j++) {
      cells += `<div class="pcell head${isSel('top', j) ? ' sel' : ''}" data-kind="top" data-n="${j}">${j}</div>`;
    }
    for (let i = 1; i <= 10; i++) {
      cells += `<div class="pcell head${isSel('left', i) ? ' sel' : ''}" data-kind="left" data-n="${i}">${i}</div>`;
      for (let j = 1; j <= 10; j++) {
        let cls = 'pcell';
        if (ready && i === hi && j === hj) cls += ' answer';
        else if (ready && (i === hi || j === hj)) cls += ' path';
        cells += `<div class="${cls}" data-i="${i}" data-j="${j}">${i * j}</div>`;
      }
    }
    return `${banner}<div class="pwrap"><div class="pgrid">${cells}</div></div>`;
  }

  function renderTable() {
    // подсветка активной вкладки
    [...tableTabs.children].forEach(t => t.classList.toggle('active', t.dataset.mode === tableMode));
    // выбор числа нужен только для умножения и деления
    tablePick.style.display = (tableMode === 'pif') ? 'none' : '';
    [...tablePick.children].forEach(b => b.classList.toggle('active', parseInt(b.dataset.val, 10) === tableNum));

    if (tableMode === 'pif') { tableBody.innerHTML = pifGrid(); return; }

    let rows = '';
    for (let k = 1; k <= 10; k++) {
      let left, res;
      if (tableMode === 'mul') { left = `${tableNum} × ${k}`; res = tableNum * k; }
      else                     { left = `${tableNum * k} ÷ ${tableNum}`; res = k; }
      rows += `<div class="trow"><span>${left}</span><span class="res">= ${res}</span></div>`;
    }
    tableBody.innerHTML = `<div class="tlist">${rows}</div>`;
  }

  // ---------- События ----------
  document.getElementById('openTables').addEventListener('click', () => { renderTable(); show(tablesEl); });
  document.getElementById('tablesBack').addEventListener('click', () => show(setupEl));
  document.getElementById('startBtn').addEventListener('click', startTraining);
  checkBtn.addEventListener('click', checkAnswer);
  nextBtn.addEventListener('click', goNext);
  document.getElementById('quitBtn').addEventListener('click', () => { stopTimer(); show(setupEl); });
  document.getElementById('menuBtn').addEventListener('click', () => show(setupEl));
  document.getElementById('againBtn').addEventListener('click', startTraining);
  answerInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
</script>
</body>
</html>
