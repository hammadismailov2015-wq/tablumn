<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр таблицы умножения</title>
<style>
  :root {
    --bg: #14142b;
    --bg2: #1c1c3f;
    --card: #232349;
    --ink: #f0f0ff;
    --muted: #9a9ac8;
    --line: #34346a;
    --violet: #7c6cf0;
    --violet-2: #9a8bff;
    --mint: #34d399;
    --coral: #ff6b6b;
    --gold: #ffcb5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-rounded, "Segoe UI Rounded", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #2a2a63 0%, transparent 55%),
      radial-gradient(1000px 500px at 110% 110%, #3a2a63 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border-radius: 26px;
    padding: 30px 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    border: 1px solid var(--line);
  }
  h1 { font-size: 24px; text-align: center; letter-spacing: .3px; text-wrap: balance; }
  .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin: 8px 0 22px; }
  .label {
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); text-align: center; margin: 4px 0 12px;
  }
  .picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; margin-bottom: 10px; }
  .pick-btn {
    padding: 14px 0; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    color: var(--ink); border-radius: 14px; font: inherit; font-size: 18px; font-weight: 700;
    cursor: pointer; transition: transform .12s, background .15s, border-color .15s;
    font-variant-numeric: tabular-nums;
  }
  .pick-btn:hover { border-color: var(--violet); transform: translateY(-2px); }
  .pick-btn.active {
    background: linear-gradient(180deg, var(--violet-2), var(--violet));
    border-color: transparent; color: #fff; box-shadow: 0 8px 20px rgba(124,108,240,.45);
  }
  .pick-btn.all { grid-column: span 5; letter-spacing: .3px; margin-bottom: 4px; }
  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 16px; }
  .record-line {
    text-align: center; color: var(--gold); font-weight: 700; font-size: 15px; margin: 6px 0 16px;
  }
  .start-btn {
    width: 100%; padding: 16px; margin-top: 4px;
    background: linear-gradient(180deg, var(--violet-2), var(--violet)); color: #fff; border: none;
    border-radius: 16px; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer;
    box-shadow: 0 12px 26px rgba(124,108,240,.4); transition: transform .12s, filter .15s;
  }
  .start-btn:hover { filter: brightness(1.07); transform: translateY(-2px); }
  .start-btn:active { transform: translateY(0); }

  .stats { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .timer { font-weight: 800; font-size: 16px; color: var(--mint); font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--coral); }
  .progress-bar { height: 10px; background: rgba(0,0,0,.3); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--mint)); transition: width .35s ease; }
  .question { text-align: center; font-size: 52px; font-weight: 800; margin: 6px 0 22px; font-variant-numeric: tabular-nums; }
  .answer-input {
    width: 100%; padding: 18px; font: inherit; font-size: 30px; font-weight: 700; text-align: center;
    border-radius: 16px; border: 2px solid var(--line); background: rgba(0,0,0,.25);
    color: var(--ink); outline: none; transition: border-color .15s; -moz-appearance: textfield;
  }
  .answer-input::-webkit-outer-spin-button, .answer-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .answer-input:focus { border-color: var(--violet); }
  .answer-input.shake { animation: shake .4s; border-color: var(--coral); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }
  @media (prefers-reduced-motion: reduce) { .answer-input.shake { animation: none; } * { transition: none !important; } }
  .feedback { text-align: center; min-height: 26px; margin: 16px 0; font-size: 16px; font-weight: 700; }
  .feedback.good { color: var(--mint); }
  .feedback.bad { color: var(--coral); }
  .row-btns { display: flex; gap: 12px; }
  .btn { flex: 1; padding: 15px; border-radius: 16px; border: none; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform .12s, filter .15s; }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: linear-gradient(180deg, var(--violet-2), var(--violet)); color: #fff; box-shadow: 0 10px 22px rgba(124,108,240,.4); }
  .btn-ghost { background: rgba(255,255,255,.04); color: var(--ink); border: 1px solid var(--line); }
  .hidden { display: none; }
  .result { text-align: center; }
  .result .emoji { font-size: 60px; margin-bottom: 6px; }
  .result .score { font-size: 50px; font-weight: 800; margin: 6px 0; font-variant-numeric: tabular-nums; }
  .result .detail { color: var(--muted); margin-bottom: 6px; }
  .result .record-new { color: var(--gold); font-weight: 800; margin-bottom: 20px; min-height: 22px; }
</style>
</head>
<body>
<div class="app">

  <!-- ЭКРАН НАСТРОЙКИ -->
  <div id="setup">
    <h1>✖️ Тренажёр таблицы умножения</h1>
    <p class="subtitle">Выбери одно или несколько чисел</p>
    <div class="label">Множитель (можно несколько)</div>
    <div class="picker" id="picker"></div>
    <div class="label">Сколько вопросов</div>
    <div class="counts" id="counts"></div>
    <div class="record-line" id="recordLine">🏆 Рекорд: 0 очков</div>
    <button class="start-btn" id="startBtn">Начать тренировку →</button>
  </div>

  <!-- ЭКРАН ТРЕНИРОВКИ -->
  <div id="trainer" class="hidden">
    <div class="stats">
      <span>Вопрос <b id="qNum">1</b>/<b id="qTotal">10</b></span>
      <span>Очки: <b id="scoreNow">0</b></span>
      <span class="timer" id="timer">⏱ 10</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question" id="question">2 × 3</div>
    <input type="number" class="answer-input" id="answerInput" placeholder="?" inputmode="numeric" autocomplete="off">
    <div class="feedback" id="feedback"></div>
    <div class="row-btns">
      <button class="btn btn-ghost" id="quitBtn">Выйти</button>
      <button class="btn btn-primary" id="checkBtn">Проверить</button>
    </div>
  </div>

  <!-- ЭКРАН РЕЗУЛЬТАТА -->
  <div id="result" class="hidden">
    <div class="result">
      <div class="emoji" id="resultEmoji">🎉</div>
      <div class="score" id="resultScore">0 очков</div>
      <p class="detail" id="resultDetail">Верно 0 из 10</p>
      <p class="record-new" id="recordNew"></p>
      <div class="row-btns">
        <button class="btn btn-ghost" id="menuBtn">В меню</button>
        <button class="btn btn-primary" id="againBtn">Ещё раз</button>
      </div>
    </div>
  </div>

</div>

<script>
  // ====== НАСТРОЙКИ ИГРЫ (можно менять) ======
  const MAX_FACTOR = 10;   // на что умножаем во второй части примера (1..10)
  const PER_Q = 10;        // секунд на один вопрос
  const RECORD_KEY = 'multi-trainer-record';  // имя ячейки памяти для рекорда

  // ====== СОСТОЯНИЕ (то, что меняется по ходу игры) ======
  let selected = [];   // выбранные множители, например [2, 5, 9]
  let total = 10;      // сколько вопросов в раунде
  let questions = [];  // список подготовленных примеров
  let current = 0;     // номер текущего вопроса
  let score = 0;       // набранные очки
  let timeLeft = PER_Q;
  let timerId = null;  // «ручка» таймера, чтобы уметь его остановить

  // ---------- Кнопки выбора множителей ----------
  const picker = document.getElementById('picker');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('button');
    b.className = 'pick-btn pick-num';
    b.textContent = i;
    b.dataset.val = i;
    picker.appendChild(b);
  }
  const allBtn = document.createElement('button');
  allBtn.className = 'pick-btn all';
  allBtn.textContent = 'Все подряд 🎲';
  picker.appendChild(allBtn);

  // Клик по числу — включаем/выключаем его (несколько сразу)
  picker.addEventListener('click', (e) => {
    const numBtn = e.target.closest('.pick-num');
    if (numBtn) { numBtn.classList.toggle('active'); return; }
    // Клик по «Все подряд» — включаем все числа
    if (e.target.closest('.all')) {
      document.querySelectorAll('.pick-num').forEach(b => b.classList.add('active'));
    }
  });

  // ---------- Кнопки количества вопросов ----------
  const counts = document.getElementById('counts');
  [5, 10, 20].forEach((n, idx) => {
    const b = document.createElement('button');
    b.className = 'pick-btn' + (idx === 1 ? ' active' : ''); // по умолчанию 10
    b.textContent = n;
    b.dataset.count = n;
    counts.appendChild(b);
  });
  counts.addEventListener('click', (e) => {
    const b = e.target.closest('.pick-btn');
    if (!b) return;
    document.querySelectorAll('#counts .pick-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    total = parseInt(b.dataset.count, 10);
  });

  // ---------- Рекорд (память браузера) ----------
  function getRecord() { return parseInt(localStorage.getItem(RECORD_KEY) || '0', 10); }
  function showRecord() { document.getElementById('recordLine').textContent = `🏆 Рекорд: ${getRecord()} очков`; }
  showRecord();

  // ---------- Переключение экранов ----------
  const setupEl = document.getElementById('setup');
  const trainerEl = document.getElementById('trainer');
  const resultEl = document.getElementById('result');
  function show(el) { [setupEl, trainerEl, resultEl].forEach(x => x.classList.add('hidden')); el.classList.remove('hidden'); }
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  // ---------- Подготовка примеров ----------
  function buildQuestions() {
    questions = [];
    for (let i = 0; i < total; i++) {
      // берём случайный множитель ИЗ выбранных игроком
      const a = selected[rand(0, selected.length - 1)];
      const b = rand(1, MAX_FACTOR);
      questions.push({ a, b, answer: a * b });
    }
  }

  // ---------- Элементы экрана тренировки ----------
  const qNum = document.getElementById('qNum');
  const qTotal = document.getElementById('qTotal');
  const scoreNow = document.getElementById('scoreNow');
  const timerEl = document.getElementById('timer');
  const questionEl = document.getElementById('question');
  const answerInput = document.getElementById('answerInput');
  const feedback = document.getElementById('feedback');
  const progressFill = document.getElementById('progressFill');

  function startTraining() {
    // собираем выбранные числа
    selected = [...document.querySelectorAll('.pick-num.active')].map(b => parseInt(b.dataset.val, 10));
    if (selected.length === 0) { alert('Выбери хотя бы одно число!'); return; }
    buildQuestions();
    current = 0; score = 0;
    qTotal.textContent = total;
    scoreNow.textContent = 0;
    show(trainerEl);
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[current];
    qNum.textContent = current + 1;
    questionEl.textContent = `${q.a} × ${q.b}`;
    answerInput.value = '';
    answerInput.disabled = false;
    feedback.textContent = '';
    feedback.className = 'feedback';
    progressFill.style.width = (current / total * 100) + '%';
    answerInput.focus();
    startTimer();
  }

  // ---------- Таймер ----------
  function startTimer() {
    timeLeft = PER_Q;
    updateTimerUI();
    timerId = setInterval(() => {
      timeLeft--;
      updateTimerUI();
      if (timeLeft <= 0) { stopTimer(); timeUp(); }
    }, 1000);
  }
  function stopTimer() { clearInterval(timerId); timerId = null; }
  function updateTimerUI() {
    timerEl.textContent = '⏱ ' + timeLeft;
    timerEl.classList.toggle('low', timeLeft <= 3);
  }

  function timeUp() {
    const q = questions[current];
    feedback.textContent = `⏱ Время вышло! ${q.a} × ${q.b} = ${q.answer}`;
    feedback.className = 'feedback bad';
    answerInput.disabled = true;
    nextSoon();
  }

  function checkAnswer() {
    if (answerInput.disabled) return;
    const q = questions[current];
    const val = answerInput.value.trim();
    if (val === '') { answerInput.focus(); return; }
    stopTimer();
    const user = parseInt(val, 10);

    if (user === q.answer) {
      const gained = 10 + timeLeft; // 10 очков + бонус за скорость
      score += gained;
      scoreNow.textContent = score;
      feedback.textContent = `✅ Верно! +${gained}`;
      feedback.className = 'feedback good';
    } else {
      feedback.textContent = `❌ Неверно. ${q.a} × ${q.b} = ${q.answer}`;
      feedback.className = 'feedback bad';
      answerInput.classList.add('shake');
      setTimeout(() => answerInput.classList.remove('shake'), 400);
    }
    answerInput.disabled = true;
    nextSoon();
  }

  function nextSoon() {
    progressFill.style.width = ((current + 1) / total * 100) + '%';
    setTimeout(() => {
      current++;
      current < total ? renderQuestion() : showResult();
    }, 950);
  }

  // ---------- Результат ----------
  function showResult() {
    show(resultEl);
    document.getElementById('resultScore').textContent = `${score} очков`;

    // сколько верных: считаем по набранным очкам не выйдет, поэтому пересчёта нет —
    // вместо этого покажем максимально возможные очки для понимания
    const maxScore = total * (10 + PER_Q);
    document.getElementById('resultDetail').textContent = `из ${maxScore} возможных`;

    const record = getRecord();
    const recordNew = document.getElementById('recordNew');
    if (score > record) {
      localStorage.setItem(RECORD_KEY, score); // сохраняем новый рекорд в память
      recordNew.textContent = '🏆 Новый рекорд!';
    } else {
      recordNew.textContent = `Рекорд: ${record} очков`;
    }

    const pct = score / maxScore;
    let emoji;
    if (pct >= 0.95)     emoji = '🏆';
    else if (pct >= 0.7) emoji = '🎉';
    else if (pct >= 0.4) emoji = '👍';
    else                 emoji = '💪';
    document.getElementById('resultEmoji').textContent = emoji;
    showRecord();
  }

  // ---------- События кнопок ----------
  document.getElementById('startBtn').addEventListener('click', startTraining);
  document.getElementById('checkBtn').addEventListener('click', checkAnswer);
  document.getElementById('quitBtn').addEventListener('click', () => { stopTimer(); show(setupEl); });
  document.getElementById('menuBtn').addEventListener('click', () => show(setupEl));
  document.getElementById('againBtn').addEventListener('click', startTraining);
  answerInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
</script>
</body>
</html>
